# gt1conv configuration
# Changes are picked up automatically within ~1 s (no restart needed). If the file has errors,
# the previous configuration stays active (see: journalctl -u gt1conv).

# base directory for relative IR paths
irdir = /home/pi/ir

# ---- level -------------------------------------------------------------------------------
# norm = peak    loudest 1/3-octave band between 80 Hz and 6 kHz is set to 'ref' dB (default)
#        energy  IR energy set to 'ref' dB (old behaviour, IRs boost the guitar band by ~5-10 dB)
#        off     IR file level, scaled by 'ref'
norm = peak
# +1.5 dB matches the GT-1's internal cab sim level (calibrated by ear with Magma / V7X)
ref = 1.5
# soft clipper: output above this level (dBFS) is rounded off smoothly instead of hard clipping
limit = -3

# ---- IR processing -----------------------------------------------------------------------
# maximum IR length in ms (longer IRs are faded out), trim leading silence (yes/no)
maxlen = 1000
trim = no

# ---- IR switching ------------------------------------------------------------------------
# new IR runs this long in the background before it is crossfaded in (ms); >= 50 ms makes the
# new IR exact from the first sample of the crossfade. Then crossfade length (ms).
warmup = 50
xfade = 20

# ---- mapping -----------------------------------------------------------------------------
# Value: <file> | "<file>" | bypass, optionally followed by: gain <dB>
# Paths may contain spaces; quote them if they contain '#' or end in "gain <number>".
#
# Priority: name token in the patch name  >  patch number mapping  >  default

default = "Origin Effects - IR-Cab Library V3/44.1kHz Origin Effects IR Cab Library/Magma Vintage 1x12/Magma Vintage 1x12 Medium Mix.wav"

# per patch: U01..U99 (user), P01..P99 (preset)
#U01 = V7X_dc.wav
#U02 = greenback 212 1 mono.wav gain -1
#U05 = bypass

# name tokens: put "IRx" into the patch name on the GT-1 (at the start or after a space,
# followed by a space or the end of the name), e.g. "CLEAN TWIN IR1". x = 0-9, a-z, A-Z
IR0 = bypass

# top level of irdir (sorted by name, BlendOfAll_dc.wav left out)
IR1 = "EV MIX B.wav"
IR2 = "EV MIX D.wav"
IR3 = "greenback 212 1 mono.wav"
IR4 = "greenback 212 2 mono.wav"
IR5 = "greenback 410 3 mono.wav"
IR6 = "greenback 410 4 mono.wav"
IR7 = "RB500_dc.wav"
IR8 = "SC1100_dc.wav"
IR9 = "V7X_dc.wav"

# Origin Effects IR-Cab Library V3, 44.1 kHz, Medium Mix of each cabinet (sorted by name)
IRa = "Origin Effects - IR-Cab Library V3/44.1kHz Origin Effects IR Cab Library/American Twin 2x12/American Twin 2x12 Medium Mix.wav"
IRb = "Origin Effects - IR-Cab Library V3/44.1kHz Origin Effects IR Cab Library/British Alnico 2x12/British Alnico 2x12 Medium Mix.wav"
IRc = "Origin Effects - IR-Cab Library V3/44.1kHz Origin Effects IR Cab Library/British Checkerboard 4x12/British Checkerboard 4x12 Medium Mix.wav"
IRd = "Origin Effects - IR-Cab Library V3/44.1kHz Origin Effects IR Cab Library/British Straight 4x12/British Straight 4x12 Medium Mix.wav"
IRe = "Origin Effects - IR-Cab Library V3/44.1kHz Origin Effects IR Cab Library/Brown Deluxe 1x12/Brown Deluxe 1x12 Medium Mix.wav"
IRf = "Origin Effects - IR-Cab Library V3/44.1kHz Origin Effects IR Cab Library/Lux-O-Vibe 2x10/LuxOVibe 2x10 Medium Mix.wav"
IRg = "Origin Effects - IR-Cab Library V3/44.1kHz Origin Effects IR Cab Library/Magma Vintage 1x12/Magma Vintage 1x12 Medium Mix.wav"
